# Render Blueprint — deploys the backend stack in one click.
# Render dashboard -> New -> Blueprint -> pick this repository -> Apply.
#
# Render's free tier runs ONLY web services and Postgres (no cron jobs,
# no background workers), so this is the entire cloud stack:
#
#   sct-db   free Postgres; DATABASE_URL auto-wired into the service
#   sct-api  FastAPI with in-process background jobs (app/jobs.py):
#            telemetry simulation every 30s + prediction recompute every
#            5 min, enabled via RUN_BACKGROUND_JOBS=true. The database is
#            seeded on first boot and the RandomForest model is trained
#            into the image at BUILD time (models are gitignored, and
#            make_dataset.py is DB-free by design for exactly this).
#
# rootDir is the repo root (not backend/) because the in-app jobs import
# from simulator/ and prediction/; uvicorn gets --app-dir backend instead.
#
# Free-web-service note: the instance sleeps after ~15 min idle and the
# jobs pause with it; the first request cold-starts in ~50s. An external
# uptime pinger (e.g. cron-job.org hitting /health every 10 min) keeps it
# warm if you want the simulation running 24/7.

databases:
  - name: sct-db
    databaseName: sct
    user: sct
    plan: free

services:
  - type: web
    name: sct-api
    runtime: python
    plan: free
    region: oregon
    rootDir: .
    buildCommand: >-
      pip install -r backend/requirements.txt -r prediction/requirements.txt &&
      python prediction/make_dataset.py --rows 20000 &&
      python prediction/train_upgraded.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: sct-db
          property: connectionString
      - key: RUN_BACKGROUND_JOBS
        value: "true"
      - key: SIM_INTERVAL_SECONDS
        value: "30"
      - key: SIM_HOURS_PER_TICK
        value: "3"
      - key: PREDICTION_INTERVAL_SECONDS
        value: "300"
